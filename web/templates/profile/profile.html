{{define "title"}}Profil — ForumJS{{end}}

{{define "extra_css"}}
<link rel="stylesheet" href="/static/css/profile.css">
{{end}}

{{define "content"}}
<div class="profile-layout">

    <main class="profile-main">
        <div class="profile-tabs">
            <a href="/home">Home</a>
            <a href="/profile/liked-posts">Activity</a>
            <a href="#">About</a>
        </div>

        <div class="profile-reading-list">
            <h3>Reading list</h3>
            {{if .Posts}}
                {{range .Posts}}
                <article class="profile-post-card">
                    <a href="/post/{{.ID}}">{{.Title}}</a>
                    <span>Par {{.Username}} — 👍 {{.LikeCount}}</span>
                </article>
                {{end}}
            {{else}}
                <p>no stories</p>
            {{end}}
        </div>
    </main>

    <aside class="profile-aside">
        <img src="/static/img/photoprofil.jpg" alt="photo de profil">
        <h3>{{.User.Username}}</h3>
        <a href="#">Edit profile</a>
    </aside>

</div>
{{end}}
