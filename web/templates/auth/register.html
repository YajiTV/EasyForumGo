{{define "title"}}Inscription — ForumJS{{end}}

{{define "content"}}
<div class="form-page auth-page">

    <div class="form-header">
        <p class="form-kicker">Nouveau sur ForumJS</p>
        <h1 class="form-title">Créer un compte</h1>
        <p class="form-subtitle">Rejoignez la communauté et participez aux discussions.</p>
    </div>

    {{if .Error}}
    <p class="form-error">{{.Error}}</p>
    {{end}}

    <form action="/register" method="POST" class="auth-form">
        <div class="form-group">
            <label for="username">Nom d'utilisateur</label>
            <input type="text" id="username" name="username"
                   placeholder="Votre pseudo"
                   value="{{.Username}}" required>
        </div>

        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="exemple@email.com"
                   value="{{.Email}}" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   placeholder="Choisissez un mot de passe" required>
        </div>

        <div class="form-group">
            <label for="confirm_password">Confirmez votre mot de passe</label>
            <input type="password" id="confirm_password" name="confirm_password"
                   placeholder="Répétez votre mot de passe" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Créer mon compte</button>
        </div>
    </form>

    <p class="muted auth-switch">
        Déjà un compte ? <a href="/login">Se connecter</a>
    </p>

</div>
{{end}}
