{{define "title"}}Connexion — ForumJS{{end}}

{{define "content"}}
<div class="form-page auth-page">

    <!-- page heading -->
    <div class="form-header">
        <p class="form-kicker">Bienvenue</p>
        <h1 class="form-title">Connexion</h1>
        <p class="form-subtitle">Connectez-vous pour participer aux discussions.</p>
    </div>

    <!-- authentication error returned by the server -->
    {{if .Error}}
    <p class="form-error">{{.Error}}</p>
    {{end}}

    <!-- login form -->
    <form action="/login" method="POST" class="auth-form">
        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="exemple@email.com"
                   value="{{.Email}}" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   placeholder="Votre mot de passe" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Se connecter</button>
        </div>
        <a href="/auth/google" class="btn-google>">Se connecter avec Google</a>
    </form>

    <!-- registration link -->
    <p class="muted auth-switch">
        Pas encore de compte ? <a href="/register">S'inscrire</a>
    </p>

</div>
{{end}}
