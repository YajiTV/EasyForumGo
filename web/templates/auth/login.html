{{define "title"}}Connexion — ForumJS{{end}}

{{define "content"}}
<div class="form-page" style="max-width: 480px;">

    <div class="form-header">
        <p class="form-kicker">Bienvenue</p>
        <h1 class="form-title">Connexion</h1>
        <p class="form-subtitle">Connectez-vous pour participer aux discussions.</p>
    </div>

    {{if .Error}}
    <p class="form-error">{{.Error}}</p>
    {{end}}

    <form action="/login" method="POST" style="display:flex; flex-direction:column; gap:26px;">
        <div class="form-group">
            <label for="email">Adresse e-mail</label>
            <input type="email" id="email" name="email"
                   placeholder="exemple@email.com"
                   value="{{.Email}}" required>
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="password" id="password" name="password"
                   placeholder="Votre mot de passe" required>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn-primary">Se connecter</button>
        </div>
    </form>

    <p class="muted" style="margin-top: 24px;">
        Pas encore de compte ? <a href="/register" style="color: var(--accent); text-decoration: underline;">S'inscrire</a>
    </p>

</div>
{{end}}
