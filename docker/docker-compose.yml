services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8080:8080"
      - "8443:8443"
    volumes:
      - db_data:/app/data
      - uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/forum.db
      - PORT=8080
      - HTTPS_PORT=8443
      - TLS_CERT_FILE=/app/certs/cert.pem
      - TLS_KEY_FILE=/app/certs/key.pem
    restart: unless-stopped

volumes:
  db_data:
  uploads:
