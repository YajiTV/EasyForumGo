services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: forum_app
    ports:
      - "3000:3000"
    volumes:
      - db_data:/app/data        # persistance SQLite
      - uploads:/app/uploads     # persistance images uploadées
    environment:
      - DB_PATH=/app/data/forum.db
    restart: unless-stopped

volumes:
  db_data:
  uploads:
