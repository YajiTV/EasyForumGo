services:
  forum:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "${HOST_BIND:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    expose:
      - "8080"
    volumes:
      - db_data:/app/data
      - uploads:/app/uploads
    environment:
      APP_ENV: ${APP_ENV:-dev}
      APP_BASE_PATH: ${APP_BASE_PATH:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DB_PATH: /app/data/forum.db
      PORT: "8080"
      SESSION_DURATION_H: ${SESSION_DURATION_H:-24}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-20}
      OAUTH_ID: ${OAUTH_ID:-}
      OAUTH_KEY: ${OAUTH_KEY:-}
    restart: unless-stopped
    networks:
      - web

volumes:
  db_data:
  uploads:

networks:
  web:
    name: web
